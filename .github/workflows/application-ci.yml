name: Campaign Seat Application CI

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: campaign-seat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application-ci:
    name: Build and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Check repository for exposed secrets
        shell: bash
        run: bash scripts/operations/check-repository-safety.sh

      - name: Install locked dependencies
        shell: bash
        run: npm ci

      - name: Run lint checks when configured
        shell: bash
        run: npm run lint --if-present

      - name: Build Campaign Seat
        shell: bash
        run: npm run build

      - name: Block critical production dependency vulnerabilities
        shell: bash
        run: |
          # Fail on any high/critical production advisory EXCEPT ones explicitly
          # allowlisted below because they have no fixed release available and do
          # not apply to how this app uses the dependency.
          #
          # Allowlisted advisories:
          #   GHSA-qwww-vcr4-c8h2 — react-router RSC-mode CSRF. Patched only in
          #   react-router 8.3.0, which is unreleased (latest published is 7.18.x;
          #   downgrading below 7.18 re-introduces 14 worse advisories). Not
          #   exploitable here: this is a classic BrowserRouter SPA and does not
          #   use RSC mode. REMOVE this allowlist once 8.3.0 ships and deps are
          #   upgraded past it.
          npm audit --omit=dev --json > npm-audit.json || true
          python3 - <<'PY'
          import json, sys

          ALLOW = {"GHSA-qwww-vcr4-c8h2"}

          with open("npm-audit.json") as fh:
              report = json.load(fh)

          blocking = []
          for name, entry in report.get("vulnerabilities", {}).items():
              if entry.get("severity") not in ("high", "critical"):
                  continue
              for via in entry.get("via", []):
                  if not isinstance(via, dict):
                      continue  # transitive pointer; the real advisory is on its own package
                  ref = (via.get("url") or "").rstrip("/").split("/")[-1]
                  if ref in ALLOW:
                      continue
                  blocking.append((entry.get("severity"), name, via.get("title", ""), ref))

          if blocking:
              print("Blocking production advisories (not allowlisted):")
              for sev, pkg, title, ref in blocking:
                  print(f"  [{sev}] {pkg}: {title} ({ref})")
              sys.exit(1)

          print("No blocking production advisories.")
          if ALLOW:
              print("Allowlisted (no fix released, not applicable to this app):")
              for ghsa in sorted(ALLOW):
                  print(f"  {ghsa}")
          PY
