    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a2038" />
    <meta name="application-name" content="Campaign Seat" />
    <meta name="apple-mobile-web-app-title" content="Campaign Seat" />
    <meta name="description" content="Campaign Seat connects contacts, communication history, documents, decisions and follow-ups in one organized campaign workspace. Request a private walkthrough." />
    <link rel="canonical" href="https://campaignseat.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Campaign Seat" />
    <meta property="og:title" content="Campaign Seat | Every conversation. One shared campaign record." />
    <meta property="og:description" content="Every conversation matters. Keep the whole story. One home for campaign contacts, communication history and the work that follows." />
    <meta property="og:url" content="https://campaignseat.com/" />
    <title>Campaign Seat | Every conversation. One shared campaign record.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pages/PublicCampaignSeatV109/WebsiteEntry.jsx"></script>
    <script>
      // Retire stale app/PWA service workers on the public website only.
      if ("serviceWorker" in navigator &&
          (location.hostname === "campaignseat.com" || location.hostname === "www.campaignseat.com")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => Promise.all(regs.map((reg) => reg.unregister())))
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
